.logo{display:block;width:min(58vw,250px);height:auto;margin:0 auto 14px}
.panel{background:linear-gradient(160deg,#00a0a0,#007f86);border-radius:28px;padding:30px 20px 34px;max-width:780px;margin:0 auto;box-shadow:0 14px 36px rgba(0,60,60,.35)}
h1{font-size:clamp(28px,6.5vw,46px);line-height:1.15;margin:0 0 14px;color:#fff}
h1 span{color:#fff3b0}
.lead{font-size:clamp(17px,2.6vw,20px);max-width:620px;margin:0 auto 18px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 26px;padding:0;list-style:none}
.chips li{background:#fff;color:#006e6e;font-weight:600;padding:9px 16px;border-radius:999px;font-size:15px}
.btn{display:inline-block;min-height:52px;padding:14px 32px;border:0;border-radius:14px;background:var(--cta);color:#fff;font:700 18px/1.2 inherit;font-family:inherit;text-decoration:none;cursor:pointer;box-shadow:0 6px 16px rgba(245,130,32,.4)}
.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.6;cursor:wait}
@media(min-width:900px){
 .hero{min-height:100vh;padding:7vh 0 8vh;display:flex;align-items:center}
 .hero::before{height:100%;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 40%,transparent 92%);mask-image:linear-gradient(#000 40%,transparent 92%)}
 .hero .wrap{width:100%}.logo{width:280px}.panel{padding:40px 48px 44px;background:linear-gradient(160deg,rgba(0,160,160,.95),rgba(0,127,134,.95))}}
/* sections */
.points{list-style:none;margin:0 auto 26px;padding:0;max-width:560px;text-align:left;display:grid;gap:10px}
.points li{background:#fff;color:#006e6e;font-weight:600;border-radius:14px;padding:11px 14px 11px 44px;position:relative;font-size:15.5px;line-height:1.4}
.points li::before{content:"✓";position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#00a0a0;color:#fff;font-size:13px;display:grid;place-items:center}
.banner{background:var(--teal);padding:36px 0 28px}
.pic{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 10px 28px rgba(0,50,50,.35)}
.agen{background:var(--page);color:var(--text);padding:60px 0 64px;text-align:center}
.agen h2,.app h2{font-size:clamp(24px,4.5vw,34px);line-height:1.2;margin:0 0 12px}
.agen .sub{margin-bottom:28px;max-width:660px}
.agen .grid{text-align:left;margin-bottom:30px}
.app{background:var(--teal);color:#fff;padding:60px 0 64px;text-align:center}
.app .pic{max-width:760px;margin:22px auto 26px}

.teal{background:var(--teal);color:#fff;padding:56px 0 72px}
.teal h2,.agen h2{font-size:clamp(24px,4.5vw,34px);line-height:1.2;margin:0 0 26px;text-align:center}
.sub{text-align:center;max-width:620px;margin:0 auto 8px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}

@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;color:#0b3d3d;border-radius:18px;padding:22px 20px;box-shadow:0 4px 14px rgba(0,60,60,.18)}
.card .ic{font-size:30px;display:block;margin-bottom:8px}.card b{display:block;margin-bottom:4px;color:#006e6e}
.forms{background:linear-gradient(var(--teal),#00868a);color:#fff;padding:0 0 72px}.forms .box{margin-top:0}
.box{background:var(--card);color:var(--text);max-width:560px;margin:0 auto;border-radius:22px;padding:28px 22px;box-shadow:0 10px 30px rgba(0,50,50,.3)}
.box h2{color:var(--text);font-size:clamp(22px,4vw,28px)}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;min-height:50px;padding:12px 14px;border:2px solid #9fdcd6;border-radius:12px;font:inherit;color:#0b3d3d;background:#f4fffd}
input:focus{outline:3px solid #f5822066;border-color:var(--cta)}
input[aria-invalid="true"]{border-color:#d33}
.err{color:#c62828;font-size:14px;min-height:18px;margin:4px 0 0}
.hp{position:absolute;left:-9999px}
.box .btn{width:100%;margin-top:22px}
.note{font-size:13px;opacity:.75;margin:12px 0 0;text-align:center}
.ok{display:none;text-align:center;padding:12px 0}.ok .ic{font-size:44px}
.sec{padding:56px 0;background:var(--page);color:var(--text)}.sec h2{text-align:center;margin:0 0 24px;font-size:clamp(22px,4vw,30px)}
.vids{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.vids iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}
.links{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.links a{display:block;background:var(--card);color:var(--text);border-radius:14px;padding:16px;text-decoration:none;border:1px solid #9fdcd6}
.links a small{display:block;opacity:.75}
footer{background:#006e6e;color:#d8f5f1;text-align:center;padding:28px 20px;font-size:14px}
footer b{color:#fff}
</style>
</head>
